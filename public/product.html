<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Meesho</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <h1 class="brand-logo"><a href="index.html" style="text-decoration:none; color:inherit;">m meesho</a></h1>
        </div>
        <div class="header-nav-links">
            <a href="index.html">Home</a>
            <a href="cart.html">Cart & Saved</a>
        </div>
    </header>

    <main class="container">
        <div id="productDetailContainer" class="product-detail-grid" style="margin-top: 20px;">
            <p>Loading product details...</p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id');

            if (!productId) {
                document.getElementById('productDetailContainer').innerHTML = '<p>No product selected.</p>';
                return;
            }

            try {
                const response = await fetch(`/api/products/${productId}`);
                const data = await response.json();

                if (response.ok && data.product) {
                    const p = data.product;
                    document.getElementById('productDetailContainer').innerHTML = `
                        <div>
                            <img src="${p.image}" alt="${p.title}" class="main-pdp-img" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30'" />
                        </div>
                        <div>
                            <span class="bharat-badge">${p.category}</span>
                            <h2 style="margin: 10px 0; font-size: 22px;">${p.title}</h2>
                            <div class="price-tag" style="font-size: 24px; color: var(--primary-color);">₹${p.price}</div>
                            <p style="color: #388e3c; font-weight: bold; margin: 10px 0;">Free Delivery | Cash on Delivery Available</p>
                            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
                            <h4>Product Description</h4>
                            <p style="color: #555; font-size: 14px; margin-top: 8px; line-height: 1.6;">${p.description}</p>
                            <button onclick="alert('Added to cart successfully!')" class="btn-success" style="margin-top: 20px;">Add to Cart</button>
                        </div>
                    `;
                } else {
                    document.getElementById('productDetailContainer').innerHTML = '<p>Product not found.</p>';
                }
            } catch (err) {
                console.error('Error loading product:', err);
                document.getElementById('productDetailContainer').innerHTML = '<p>Error loading product details.</p>';
            }
        });
    </script>
</body>
</html>
